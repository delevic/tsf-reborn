name: Build TSF Reborn APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack project
        run: |
          rm -rf project
          mkdir project
          unzip -q TSF-Reborn-v0.2.zip -d project

      - name: Build debug APK
        run: |
          cd project/TSF-Reborn-v0.2
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TSF-Reborn-v0.2-debug
          path: project/TSF-Reborn-v0.2/app/build/outputs/apk/debug/app-debug.apk
