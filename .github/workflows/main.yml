name: Build TSF Reborn APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Bootstrap source tree from ZIP
        if: ${{ hashFiles('app/build.gradle') == '' }}
        run: |
          rm -rf _bootstrap
          mkdir _bootstrap
          unzip -q TSF-Reborn-v0.2.zip -d _bootstrap
          cp -a _bootstrap/TSF-Reborn-v0.2/. .
          rm -rf _bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md app build.gradle docs gradle.properties settings.gradle
          git commit -m "Bootstrap TSF Reborn source tree" || true
          git push

      - name: Apply source migrations
        run: |
          if [ -f scripts/apply_topfix.py ]; then
            python3 scripts/apply_topfix.py
            if ! git diff --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add app/src/main/java/rs/codel/tsfreborn/MainActivity.java app/src/main/res/values/styles.xml
              git commit -m "Apply fullscreen topfix"
              git push
            fi
          fi

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TSF-Reborn-debug
          path: app/build/outputs/apk/debug/app-debug.apk
