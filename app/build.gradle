plugins {
    id 'com.android.application'
}

android {
    namespace 'rs.codel.tsfreborn'
    compileSdk 35

    defaultConfig {
        applicationId 'rs.codel.tsfreborn'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    signingConfigs {
        stableDebug {
            storeFile rootProject.file('.ci/tsf-debug.keystore')
            storePassword 'tsfreborn'
            keyAlias 'tsfdebug'
            keyPassword 'tsfreborn'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
